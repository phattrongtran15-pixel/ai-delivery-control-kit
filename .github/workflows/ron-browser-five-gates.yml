name: RON Browser Five Gates — dossier verifier
on:
  push:
    branches: [sandbox/upstream-browser-skill-farm-20261026]
    paths:
      - sandbox/upstream-browser-skill-farm-20261026/five-gates/**
      - .github/workflows/ron-browser-five-gates.yml
  workflow_dispatch:
    inputs:
      mode:
        description: "Read-only dossier verification only (G5 remains HOLD)"
        required: true
        default: verify_only
        type: choice
        options: [verify_only]
permissions:
  contents: read
concurrency:
  group: ron-browser-five-gates-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-dossier:
    if: github.repository == 'phattrongtran15-pixel/ai-delivery-control-kit'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check exact GitHub revision / file syntax
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/five-gates
          python -m py_compile \
            sandbox/upstream-browser-skill-farm-20261026/five-gates/scripts/validate_dossier.py \
            sandbox/upstream-browser-skill-farm-20261026/five-gates/scripts/test_fail_closed.py \
            sandbox/upstream-browser-skill-farm-20261026/five-gates/scripts/independent_readback.py
          git rev-parse HEAD | tee evidence/five-gates/source_sha.txt
      - name: Validate all 9 OpenSpec requirements, gate state, both runbooks
        run: |
          python sandbox/upstream-browser-skill-farm-20261026/five-gates/scripts/validate_dossier.py \
            --root sandbox/upstream-browser-skill-farm-20261026/five-gates \
            --report evidence/five-gates/builder-receipt.json
      - name: Run 12 high-priority fail-closed tests
        run: |
          python sandbox/upstream-browser-skill-farm-20261026/five-gates/scripts/test_fail_closed.py \
            sandbox/upstream-browser-skill-farm-20261026/five-gates \
            evidence/five-gates/negative-tests.json
      - name: Validate real LikeC4 1.60.0 syntax / relationships
        shell: bash
        run: |
          set -euo pipefail
          cd sandbox/upstream-browser-skill-farm-20261026/five-gates
          timeout 240s npx --yes likec4@1.60.0 validate --json --no-layout \
            --file likec4/browser-intelligence.c4 . \
            > "$GITHUB_WORKSPACE/evidence/five-gates/likec4-validate.json"
          echo "RON_REAL_LIKEC4_VALIDATED"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ron-five-gates-builder
          path: evidence/five-gates/
          retention-days: 30
          if-no-files-found: warn

  independent-verify:
    if: github.repository == 'phattrongtran15-pixel/ai-delivery-control-kit'
    needs: build-dossier
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          name: ron-five-gates-builder
          path: builder-evidence/
      - name: Independently read all 11 source files and match exact SHA
        run: |
          python sandbox/upstream-browser-skill-farm-20261026/five-gates/scripts/independent_readback.py \
            --root sandbox/upstream-browser-skill-farm-20261026/five-gates \
            --builder-receipt builder-evidence/builder-receipt.json \
            --out evidence/five-gates/independent-verdict.json
      - name: Ensure G5 is still HOLD (no real gate transition)
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("evidence/five-gates/independent-verdict.json")
          data=json.loads(p.read_text())
          assert data["status"]=="G4_DOSSIER_INTEGRITY_PASS"
          assert data["G5"]=="HOLD_OWNER_ACCEPTANCE"
          assert not data["ron_accepted"]
          print("RON_FIVE_GATES_G4_DOSSIER_INTEGRITY_VERIFIED_G5_HOLD")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ron-browser-five-gates-receipt
          path: evidence/five-gates/
          retention-days: 30
          if-no-files-found: warn
