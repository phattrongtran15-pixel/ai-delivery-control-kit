name: OpenClaw Windows ready bootstrap static CI
on:
  push:
    branches: [sandbox/openclaw-cp3-20261104]
    paths:
      - .github/workflows/openclaw-windows-ready.yml
      - experiments/openclaw-ready/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pwsh-contract:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Parse script in Windows PowerShell and PowerShell 7
        shell: pwsh
        run: |
          $t=$null;$e=$null
          [System.Management.Automation.Language.Parser]::ParseFile("experiments/openclaw-ready/Start-RonOpenClaw.ps1",[ref]$t,[ref]$e)|Out-Null
          if($e.Count -gt 0){$e|ForEach-Object {Write-Error $_};exit 1}
          Write-Host "PARSER_PASS"
      - name: Run no-side-effect self-test
        shell: pwsh
        run: |
          ./experiments/openclaw-ready/Start-RonOpenClaw.ps1 -Mode SelfTest
          if(-not $?){throw "PowerShell 7 offline self-test failed"}
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File "experiments/openclaw-ready/Start-RonOpenClaw.ps1" -Mode SelfTest
          if($LASTEXITCODE -ne 0){throw "Windows PowerShell 5.1 offline self-test failed"}
      - name: Check protected contracts
        shell: pwsh
        run: |
          $s=Get-Content -Raw "experiments/openclaw-ready/Start-RonOpenClaw.ps1"
          foreach($needle in @('ronsho-sandbox','loopback','SAFE_AUTOMATION_READY','"exec"','"automations","run"','BOOTSTRAP_HOLD.json','--no-deliver','"health","--json"')){
            if(!$s.Contains($needle)){throw "Missing guard: $needle"}
          }
          Write-Host "STATIC_GUARD_PASS"

  native-automation-ephemeral-smoke:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.12.1'
      - name: Install pinned OpenClaw on disposable Windows runner
        shell: pwsh
        run: |
          npm install -g openclaw@2026.10.10 --ignore-scripts --no-audit --no-fund
          if($LASTEXITCODE -ne 0){exit 1}
          openclaw --version
      - name: Run isolated profile/Gateway/native automations bootstrap
        id: bootstrap
        shell: powershell
        continue-on-error: true
        run: |
          & ".\experiments\openclaw-ready\Start-RonOpenClaw.ps1" -Mode Install -NoBrowser
          if($LASTEXITCODE -ne 0){exit 1}
      - name: Independent read-back via Status and log
        if: always()
        shell: powershell
        run: |
          $root=Join-Path $env:USERPROFILE ".openclaw-ronsho-sandbox"
          $dir=Join-Path $root "ronsho-evidence"
          if(Test-Path $dir){Get-ChildItem $dir | Select-Object Name,Length | Format-Table -AutoSize}
          if(Test-Path (Join-Path $dir "BOOTSTRAP_HOLD.json")){Get-Content (Join-Path $dir "BOOTSTRAP_HOLD.json")}
          if(Test-Path (Join-Path $dir "BOOTSTRAP_RESULT.json")){Get-Content (Join-Path $dir "BOOTSTRAP_RESULT.json")}
          if(Get-Command openclaw -ErrorAction SilentlyContinue){ & ".\experiments\openclaw-ready\Start-RonOpenClaw.ps1" -Mode Status }
          exit 0
      - name: Capture receipts without storing config/token
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-windows-native-safe-bootstrap-evidence
          path: ~/\.openclaw-ronsho-sandbox/ronsho-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Stop disposable Gateway and owned job
        if: always()
        shell: powershell
        run: |
          if(Test-Path (Join-Path $env:USERPROFILE ".openclaw-ronsho-sandbox\RONSHO_OWNED.json")){
            & ".\experiments\openclaw-ready\Start-RonOpenClaw.ps1" -Mode Rollback
          }
