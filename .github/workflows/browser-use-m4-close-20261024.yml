name: Browser Use M4 sandbox qualification
on:
  push:
    branches: [sandbox/browser-use-m4-close-20261024]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-use-m4-close-${{ github.ref }}
  cancel-in-progress: false
jobs:
  guard-direct:
    if: github.repository == 'phattrongtran15-pixel/ai-delivery-control-kit'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      BROWSER_USE_API_KEY: ''
      GOOGLE_API_KEY: ''
      OPENROUTER_API_KEY: ''
      ANONYMIZED_TELEMETRY: 'false'
      DO_NOT_TRACK: '1'
      BROWSER_USE_DISABLE_EXTENSIONS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit action guard
        run: python sandbox/browser-use-policy-guard-20261015/test_policy.py
      - name: Install pinned browser adapter
        run: |
          python -m pip install --disable-pip-version-check 'browser-use==0.13.11' 'playwright'
          python -m playwright install chromium
      - name: Three independent guarded browser canaries (no LLM)
        run: |
          set -euo pipefail
          for n in 1 2 3; do
            echo "M4_CANARY_ATTEMPT=${n}"
            python sandbox/browser-use-policy-guard-20261015/canary.py --mode direct
            echo "M4_CANARY_ATTEMPT_PASS=${n}"
          done
          echo 'M4_THREE_INDEPENDENT_CANARIES_PASS'
      - name: Deterministic replay 3x under strict ActionGuard with independent HTTP verifier
        run: python sandbox/browser-use-m4-close-20261024/m4_deterministic_replay.py
