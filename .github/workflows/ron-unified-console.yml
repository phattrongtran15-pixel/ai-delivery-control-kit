name: RON Unified Control Console — staging UAT
on:
  push:
    branches: [sandbox/upstream-browser-skill-farm-20261026]
    paths:
      - sandbox/upstream-browser-skill-farm-20261026/control-console/**
      - sandbox/upstream-browser-skill-farm-20261026/five-gates/**
      - .github/workflows/ron-unified-console.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  console-build:
    if: github.repository == 'phattrongtran15-pixel/ai-delivery-control-kit'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Reject forged lineage, fake runtime connections and PolicyGate escalation
        shell: bash
        run: |
          python -m py_compile sandbox/upstream-browser-skill-farm-20261026/control-console/lineage_validation.py sandbox/upstream-browser-skill-farm-20261026/control-console/test_lineage.py
          python sandbox/upstream-browser-skill-farm-20261026/control-console/test_lineage.py
      - name: Build source-backed single control dashboard and OpenSpec lineage index
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile sandbox/upstream-browser-skill-farm-20261026/control-console/build_console.py
          python sandbox/upstream-browser-skill-farm-20261026/control-console/build_console.py
          test -s sandbox/upstream-browser-skill-farm-20261026/control-console/dist/index.html
      - name: Install browser UAT fixture
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.56.0'
          python -m playwright install chromium
      - name: Verify every integrated tab, traceability, no fabricated live agents
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio,json
          from pathlib import Path
          from playwright.async_api import async_playwright
          root=Path('sandbox/upstream-browser-skill-farm-20261026/control-console/dist').resolve()
          snap=json.loads((root/'snapshot.json').read_text())
          assert snap['real_model_agents']==0 and snap['gate5']=='HOLD'
          assert [r['id'] for r in snap['requirements']]==['C'+str(i) for i in range(1,10)]
          assert all(r['accepted'] is False for r in snap['requirements'])
          assert all(r['lineage']['kind']=='DESIGN_RELATION_ONLY' for r in snap['requirements'])
          assert snap['browseros_adapter']['mode']=='DISCONNECTED'
          assert snap['ronskillstore_adapter']['mode']=='DISCONNECTED'
          assert len(snap['openspec_history'])==1 and len(snap['skill_genealogy'])==1
          assert [v['version'] for v in snap['skill_genealogy'][0]['versions']]==['0.1.0-staging','0.1.1-candidate']
          assert snap['skill_genealogy'][0]['versions'][1]['status']=='PROPOSED_UNVERIFIED'
          assert not any(v['accepted_by_ron'] for v in snap['skill_genealogy'][0]['versions'])
          async def go():
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True,args=['--no-sandbox'])
              page=await browser.new_page(viewport={'width':1440,'height':1000})
              await page.goto((root/'index.html').as_uri(),wait_until='load')
              assert await page.locator('#summary-table tr').count()==9
              assert await page.locator('.node').count()==9
              assert await page.locator('#gate-table tr').count()==5
              assert await page.locator('.warning').is_visible()
              assert 'G5' in await page.locator('#gate-table').inner_text()
              assert 'HOLD' in await page.locator('#gate-table').inner_text()
              await page.screenshot(path=str(root/'console-overview.png'),full_page=True)
              await page.locator('[data-view="lineage"]').click()
              assert await page.locator('#lineage').is_visible()
              await page.locator('[data-cap="C9"]').click()
              assert 'C9' in await page.locator('#cap-detail').inner_text()
              assert 'Ron ACCEPTED: NO' in await page.locator('#cap-detail').inner_text()
              assert await page.locator('#genealogy-list > .card').count()==1
              assert '0.1.0-staging' in await page.locator('#genealogy-list').inner_text()
              assert '0.1.1-candidate' in await page.locator('#genealogy-list').inner_text()
              assert 'PROPOSED_UNVERIFIED' in await page.locator('#genealogy-list').inner_text()
              await page.screenshot(path=str(root/'console-lineage.png'),full_page=True)
              await page.locator('[data-view="sessions"]').click()
              assert 'DISCONNECTED' in await page.locator('#browseros-status').inner_text()
              assert 'DISCONNECTED' in await page.locator('#skillstore-status').inner_text()
              await page.locator('[data-view="governance"]').click()
              assert await page.locator('#governance').is_visible()
              await page.locator('[data-view="evidence"]').click()
              assert await page.locator('#evidence').is_visible()
              mobile=await browser.new_page(viewport={'width':390,'height':844},device_scale_factor=1)
              await mobile.goto((root/'index.html').as_uri(),wait_until='load')
              await mobile.screenshot(path=str(root/'console-mobile.png'),full_page=True)
              await browser.close()
          asyncio.run(go())
          (root/'test-receipt.json').write_text(json.dumps({'state':'PASS','capabilities':9,'gates':5,'tabs':5,
            'openspec_change_history':1,'skill_versions':2,'browseros':'DISCONNECTED','ronskillstore':'DISCONNECTED',
            'model_backed_agents':0,'evidence_mode':'static_versioned_preview',
            'source_sha':snap['commit'],'G5':'HOLD',
            'not_verified':['live_BrowserOS','real_aios_shared_store','production_policygate']},indent=2)+'\n')
          print('RON_UNIFIED_CONTROL_CONSOLE_UAT_9_CAP_5_GATE_5_TAB_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ron-unified-control-console-preview
          path: sandbox/upstream-browser-skill-farm-20261026/control-console/dist/
          retention-days: 30
          if-no-files-found: error
