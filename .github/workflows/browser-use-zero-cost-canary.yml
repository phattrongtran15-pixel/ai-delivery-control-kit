name: browser-use-zero-cost-canary

on:
  push:
    branches:
      - sandbox/browser-use-zero-cost-20261015
    paths:
      - .github/workflows/browser-use-zero-cost-canary.yml
      - sandbox/browser-use-zero-cost-20261015/canary.py

permissions:
  contents: read

concurrency:
  group: browser-use-zero-cost-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-use-smoke:
    if: github.repository == 'phattrongtran15-pixel/ai-delivery-control-kit'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENAI_API_KEY: ''
      BROWSER_USE_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      GOOGLE_API_KEY: ''
      ANONYMIZED_TELEMETRY: 'false'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open-source package and browser
        run: |
          python -m pip install --disable-pip-version-check 'browser-use==0.13.11' 'playwright'
          python -m playwright install chromium
      - name: Actual Browser Use CDP click plus independent server receipt
        run: python sandbox/browser-use-zero-cost-20261015/canary.py
