[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-delivery-control"
version = "0.1.0"
description = "Evidence-gated decision tools for AI delivery control and Gateway necessity"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ron" }]
keywords = ["ai-governance", "delivery", "gateway", "evidence", "operations"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
ai-delivery-control = "ai_delivery_control.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
